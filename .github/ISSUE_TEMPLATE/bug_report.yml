name: Bug report
description: Report a reproducible PrivacyFlow defect using synthetic data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never include real credentials, customer data, raw mapping databases, or unsanitized Agent transcripts.
  - type: input
    id: version
    attributes:
      label: PrivacyFlow version or commit
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - OpenAI Chat Completions
        - OpenAI Responses
        - Anthropic Messages
        - Management API / WebUI
        - Local model runtime
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic values and include the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
